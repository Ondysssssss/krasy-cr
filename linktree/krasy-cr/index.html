  }
  @keyframes sway {
    from { transform: scale(1.12) translate(-1.5%, 0); }

  }

  /* „telefon“ — na mobilu celá obrazovka, na desktopu karta uprostřed */
  .frame {
    position: relative; z-index: 1;
    width: 100%; min-height: 100svh;
    overflow: hidden; isolation: isolate;
    background: #E9B25A;
  }
  .art { position: absolute; inset: 0; z-index: 0; will-change: transform; }
  .art img {
    display: block; width: 100%; height: 100%;
    object-fit: cover; object-position: center bottom;
    transform-origin: 50% 100%;
    animation: breathe 34s ease-in-out infinite alternate;
  }
  @keyframes breathe {
    from { transform: scale(1); }
    to   { transform: scale(1.055); }
  }

  @media (min-width: 720px) {
    body { min-height: 100vh; display: grid; place-items: center; padding-block: 28px; }
    .backdrop { display: block; }
    .frame {
      width: var(--w);
      min-height: min(calc(100vh - 56px), 920px);
      border-radius: 36px;
      box-shadow: 0 34px 90px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.14) inset;
    }
  }

  /* ---------- obsah ---------- */
  .content {
    position: relative; z-index: 1;
    padding-inline: 22px;
    padding-block: clamp(30px, 7svh, 64px) 40px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    max-width: var(--w); margin: 0 auto;
  }

  .avatar {
    width: 112px; height: 112px; border-radius: 50%;
    padding: 4px; background: var(--ring);
    box-shadow: 0 12px 30px rgba(0,0,0,.28);
    animation: float 6s ease-in-out infinite;
  }
  .avatar img {
    display: block; width: 100%; height: 100%; border-radius: 50%;
    object-fit: cover; border: 3px solid var(--ink);
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }

  .head { text-align: center; display: flex; flex-direction: column; gap: 6px; }
  h1 {
    margin: 0; color: var(--ink);
    font-family: Anton, Impact, sans-serif;
    font-weight: 400; font-size: clamp(42px, 12vw, 58px); line-height: .94; letter-spacing: .01em; text-transform: uppercase;
  }
  .bio {
    margin: 0; font-weight: 600; font-size: 15px;
    color: var(--ink-soft); max-width: 30ch;
  }

  .links { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }

  .link {
    --lift: 0px;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px 14px 14px;
    border-radius: 18px;
    background: var(--card); color: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 0 6px 0 var(--ink), 0 14px 30px rgba(0,0,0,.18);
    text-decoration: none;
    transform: translateY(var(--lift));
    transition: transform .15s cubic-bezier(.2,.8,.3,1), box-shadow .15s, background .15s;
    animation: rise .55s cubic-bezier(.2,.8,.3,1) both;
  }
  .link:nth-child(1) { animation-delay: .05s; }
  .link:nth-child(2) { animation-delay: .12s; }
  .link:nth-child(3) { animation-delay: .19s; }
  .link:nth-child(4) { animation-delay: .26s; }
  @keyframes rise { from { transform: translateY(16px); } to { transform: translateY(0); } }

  .link:hover, .link:focus-visible {
    --lift: -4px;
    background: var(--card-hover);
    box-shadow: 0 10px 0 var(--ink), 0 22px 40px rgba(0,0,0,.24);
    outline: none;
  }
  .link:focus-visible { box-shadow: 0 10px 0 var(--ink), 0 0 0 4px var(--card), 0 0 0 8px var(--accent); }
  .link:active { --lift: 3px; box-shadow: 0 3px 0 var(--ink), 0 8px 18px rgba(0,0,0,.2); }

  .icon {
    width: 46px; height: 46px; flex: none; border-radius: 13px;
    display: grid; place-items: center; background: var(--tile);
    transition: transform .22s cubic-bezier(.2,.8,.3,1);
  }
  .icon svg { width: 25px; height: 25px; fill: var(--glyph); }
  .link:hover .icon { transform: rotate(-8deg) scale(1.08); }

  .copy { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .net { font-family: Anton, Impact, sans-serif; font-size: 19px; letter-spacing: .03em; text-transform: uppercase; }
  .handle { font-size: 13px; font-weight: 600; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .arrow { margin-left: auto; flex: none; width: 26px; height: 26px; display: grid; place-items: center; transition: transform .22s cubic-bezier(.2,.8,.3,1); }
  .arrow svg { width: 18px; height: 18px; fill: var(--ink); }
  .link:hover .arrow { transform: translateX(6px); }

  .foot {
    margin: 10px 0 0; font-size: 12px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink); opacity: .55;
  }

  @media (max-width: 380px) {
    .link { padding: 12px 12px 12px 12px; gap: 11px; }
    .icon { width: 42px; height: 42px; }
    .avatar { width: 100px; height: 100px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .link { transform: none; }
  }
</style>

<script>
  // Jemný parallax pozadí podle ukazatele nebo náklonu telefonu.
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const art = document.querySelector('.art');
    if (!art) return;
    let tx = 0, ty = 0, x = 0, y = 0, running = false;
    function step() {
      x += (tx - x) * 0.06; y += (ty - y) * 0.06;
      art.style.transform = `translate(${(x * -10).toFixed(2)}px, ${(y * -6).toFixed(2)}px)`;
      if (Math.abs(tx - x) > 0.001 || Math.abs(ty - y) > 0.001) requestAnimationFrame(step); else running = false;
    }
    function aim(nx, ny) {
      tx = Math.max(-1, Math.min(1, nx)); ty = Math.max(-1, Math.min(1, ny));
      if (!running) { running = true; requestAnimationFrame(step); }
    }
    window.addEventListener('pointermove', e => aim(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1), { passive: true });
    window.addEventListener('deviceorientation', e => { if (e.gamma != null) aim(e.gamma / 45, (e.beta ?? 0) / 90); }, { passive: true });
  })();
</script>
